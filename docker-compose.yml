services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flood_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-flood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flood}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-flood_intelligence}
      PHOTO_STORAGE_DIRECTORY: /uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      GISTDA_API_KEY: ${GISTDA_API_KEY:-}
      GISTDA_API_BASE_URL: ${GISTDA_API_BASE_URL:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./database:/database
      - flood_photos:/uploads
      - ./Stores Master Sep2026.xlsx:/data/Stores Master Sep2026.xlsx:ro
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic -c /database/alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    image: node:22-alpine
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"

  # Runtime-only Valhalla service. Thailand data is deliberately prepared by
  # the profile-gated valhalla-bootstrap service, never by a normal `up`.
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:3.5.1
    environment:
      tile_urls: ""
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"
      server_threads: ${VALHALLA_SERVER_THREADS:-2}
    ports:
      - "${VALHALLA_PORT:-8002}:8002"
    volumes:
      - valhalla_data:/custom_files
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8002/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Explicit one-shot tile builder. It is excluded from normal Compose startup
  # by its profile and shares only the dedicated Valhalla volume.
  valhalla-bootstrap:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:3.5.1
    profiles: ["tools"]
    environment:
      tile_urls: ${VALHALLA_THAILAND_PBF_URL:-https://download.geofabrik.de/asia/thailand-latest.osm.pbf}
      use_tiles_ignore_pbf: "False"
      force_rebuild: ${VALHALLA_FORCE_REBUILD:-False}
      build_admins: "True"
      build_time_zones: "True"
      build_tar: "True"
      serve_tiles: "False"
      server_threads: ${VALHALLA_BUILD_THREADS:-2}
    volumes:
      - valhalla_data:/custom_files

volumes:
  postgres_data:
  flood_photos:
  valhalla_data:
